name: Sync Sheet → entities.geojson

# Descarga el CSV público del Sheet YA MIGRADO (Latitud/Longitud y
# Municipio normalizado, generado cada noche ~03:00 por el Apps Script
# "Fuerteventura Protagonista" a partir de las respuestas del formulario)
# y regenera entities.geojson. Si hay cambios respecto a lo que hay en
# git, los commitea.
#
# No hace falta ninguna credencial: el Sheet es de solo lectura por
# enlace y el geocoding ya lo hace el Apps Script, no esta Action.

on:
  schedule:
    # 04:30 UTC — después de la migración nocturna del Apps Script (~03:00).
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install --quiet -r scripts/requirements.txt

      - name: Generar entities.geojson desde el Sheet migrado
        env:
          # ID y gid del Sheet migrado (de la URL: /d/<SHEET_ID>/edit?gid=<SHEET_GID>).
          # No son sensibles: Settings → Secrets and variables → Actions → Variables.
          SHEET_ID: ${{ vars.SHEET_ID }}
          SHEET_GID: ${{ vars.SHEET_GID }}
        run: python3 scripts/sync_sheet.py

      - name: Commitear si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add entities.geojson
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "Sync: actualizar entities.geojson desde el Sheet ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
